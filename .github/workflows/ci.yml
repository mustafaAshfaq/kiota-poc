# Always-on CI. Deliberately has NO path filters: every PR and every push to
# main restores, builds and tests all three projects. This is also the break
# detector for the contract-regen PR — see contract-regen.yml.
#
# What this workflow does NOT do, on purpose:
#   * no registry push (images are built and thrown away)
#   * no `oc apply` / sandbox deploy
#   * no OpenAPI artifact upload used as a bus between jobs — the contract
#     travels through the repo (committed openapi/v1.json), not through CI.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build & test (all three projects)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KiotaContractFirstPoc.sln

      - name: Discard committed OpenAPI documents
        # So the assertion below is real: if a producer stopped emitting its
        # document at build time, the file simply will not come back.
        run: rm -f catalog-api/openapi/v1.json orders-api/openapi/v1.json

      - name: Build
        # Producers emit openapi/v1.json here: OpenApiGenerateDocumentsOnBuild
        # runs GetDocument.Insider as part of the build, so no server is started
        # and CI never fetches /openapi/v1.json over HTTP.
        run: dotnet build KiotaContractFirstPoc.sln --configuration Release --no-restore --no-incremental

      - name: Assert producers re-emitted their committed OpenAPI documents
        run: |
          set -euo pipefail
          for doc in catalog-api/openapi/v1.json orders-api/openapi/v1.json; do
            if [ ! -s "$doc" ]; then
              echo "::error::$doc was not emitted by the build"
              exit 1
            fi
            echo "$doc -> info.version=$(jq -r '.info.version' "$doc")"
          done
          # Contract drift gate: a change to a producer's shape that was not
          # committed would otherwise pass CI green and never reach
          # contract-regen.yml (whose path filter watches the committed file),
          # leaving the Storefront clients silently stale.
          if ! git diff --exit-code -- catalog-api/openapi/v1.json orders-api/openapi/v1.json; then
            echo "::error::Emitted OpenAPI differs from the committed document. Run 'dotnet build' and commit the regenerated openapi/v1.json."
            exit 1
          fi

      - name: Test
        # Storefront tests fake HTTP at the Kiota request adapter seam; no
        # producer is started and nothing talks to the network.
        run: dotnet test KiotaContractFirstPoc.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - catalog-api
          - orders-api
          - storefront-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image (linux/amd64, no push)
        # Tagged locally only. There is no registry login and no push anywhere:
        # this step exists to prove the Dockerfile still builds.
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "${{ matrix.service }}:ci-${{ github.sha }}" \
            --file "${{ matrix.service }}/Dockerfile" \
            "${{ matrix.service }}"
